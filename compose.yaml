services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: meeting
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://meeting:${POSTGRES_PASSWORD}@db:5432/meeting
      STORAGE_DIR: /srv/app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audio-data:/srv/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 5s
      retries: 10
  worker:
    build: ./backend
    command: ["python","-m","app.worker"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://meeting:${POSTGRES_PASSWORD}@db:5432/meeting
      STORAGE_DIR: /srv/app/data
    volumes:
      - audio-data:/srv/app/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  audio-data:
