pid /tmp/nginx.pid;
# Ordinary request errors can echo private query strings; use the redacted status log below.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format edge_safe escape=json '{"event":"edge.completed","request_id":"$request_id","method":"$request_method","outcome":"$status","seconds":$request_time}';
  access_log /dev/stdout edge_safe;
  server_tokens off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  keepalive_timeout 15;
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  # Bound multipart spooling across all clients before FastAPI parses upload bodies.
  limit_conn_zone $server_port zone=chunk_uploads:1m;
  limit_conn_zone $server_port zone=notes_uploads:1m;
  limit_req_zone $binary_remote_addr zone=requests:10m rate=100r/s;
  upstream meeting_api { server api:8100; keepalive 16; }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/meeting-tls/fullchain.pem;
    ssl_certificate_key /etc/meeting-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    limit_conn connections 200; # Tune against office NAT; actor limits remain database-backed.
    limit_conn_status 429;
    limit_req zone=requests burst=200 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    location = /gateway-health { return 200 'alive'; }
    location = /api/metrics { return 404; } # Corporate collector scrapes API privately with an admin JWT.
    location ~ ^/api/meetings/[^/]+/audio-chunks$ {
      client_max_body_size 17m;
      limit_conn connections 200;
      limit_conn chunk_uploads 12;
      include /etc/nginx/meeting-proxy.conf;
    }
    location ~ ^/api/recaps/[^/]+/audio$ {
      client_max_body_size 101m;
      limit_conn connections 200;
      limit_conn notes_uploads 4;
      include /etc/nginx/meeting-proxy.conf;
    }
    location /api/ { include /etc/nginx/meeting-proxy.conf; }
    # Schema is available to authenticated integration clients; Swagger stays local/internal.
    location = /api/openapi.json { include /etc/nginx/meeting-proxy.conf; }
    location / { return 404; }
  }
}
