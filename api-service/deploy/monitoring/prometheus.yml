# Merge into the corporate off-VM collector; this file does not provision a monitoring server.
global: {scrape_interval: 15s}
rule_files: [alerts.yml]
scrape_configs:
  - job_name: meeting-api
    metrics_path: /api/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/meeting_metrics_admin_access_token
    static_configs:
      - targets: [meeting-api-private.company.example]
